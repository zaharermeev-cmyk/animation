<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil Background</title>
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script>
    // всегда берём свежие файлы, а не закэшированные браузером / GitHub Pages
    window.__v = Date.now();
    document.write('<link rel="stylesheet" href="src/veil.css?v=' + __v + '">');
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--page-bg) 88%, #3a5a9a), var(--page-bg) 70%);
      background-color: var(--page-bg);
      color: var(--text);
      font: 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .version { position: fixed; left: 12px; bottom: 10px; z-index: 5; font-size: 11px; color: var(--text-muted); opacity: 0.7; }
    .controls { position: fixed; top: 16px; right: 16px; z-index: 5; display: flex; gap: 8px; }
    .controls button {
      height: 32px; padding: 0 12px; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 12px;
      color: var(--text); background: transparent;
      border: 1px solid color-mix(in srgb, var(--text) 20%, transparent);
    }
  </style>
</head>
<body>
  <canvas class="veil-canvas" id="veil" aria-hidden="true"></canvas>

  <div class="version" id="version"></div>
  <div class="controls">
    <button id="replay">Повторить интро</button>
    <button id="veils">Вуали: вкл</button>
    <button id="theme">Тема</button>
  </div>

  <script>document.write('<script src="src/veil-background.js?v=' + __v + '"><\/script>');</script>
  <script>

    const bg = new VeilBackground(document.getElementById('veil'));
    window.veil = bg;

    document.getElementById('version').textContent = 'версия ' + VeilBackground.VERSION;
    bg.start();

    document.getElementById('replay').onclick = () => bg.replay();
    document.getElementById('veils').onclick = (e) => {
      e.target.textContent = 'Вуали: ' + (bg.toggleVeils() ? 'вкл' : 'выкл');
    };
    document.getElementById('theme').onclick = () => {
      const root = document.documentElement;
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    };
  </script>
</body>
</html>
