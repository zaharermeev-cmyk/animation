<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil Background</title>
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script>
    // всегда берём свежие файлы, а не закэшированные браузером / GitHub Pages
    window.__v = Date.now();
    document.write('<link rel="stylesheet" href="src/veil.css?v=' + __v + '">');
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--page-bg) 88%, #3a5a9a), var(--page-bg) 70%);
      background-color: var(--page-bg);
      color: var(--text);
      font: 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    .version { position: fixed; left: 12px; bottom: 10px; z-index: 5; font-size: 11px; color: var(--text-muted); opacity: 0.7; }
    .controls { position: fixed; top: 16px; right: 16px; z-index: 5; display: flex; gap: 8px; }
    .controls button {
      height: 32px; padding: 0 12px; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 12px;
      color: var(--text); background: transparent;
      border: 1px solid color-mix(in srgb, var(--text) 20%, transparent);
    }

    /* ===== панель эффектов ===== */
    .fx {
      position: fixed; top: 60px; right: 16px; z-index: 5; width: 220px;
      padding: 12px 14px; border-radius: 12px; font-size: 12.5px;
      background: color-mix(in srgb, var(--page-bg) 80%, transparent);
      border: 1px solid color-mix(in srgb, var(--text) 16%, transparent);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .fx-title { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 8px; }
    .fx-title button { all: unset; cursor: pointer; font-size: 11px; color: var(--text-muted); }
    .fx label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; color: var(--text); }
    .fx input { accent-color: #5b82f7; }
    .fx.collapsed label { display: none; }
    .fx.collapsed .fx-title { margin-bottom: 0; }

    /* ===== окно входа в админку (накладывается поверх фона) ===== */
    :root {
      --login-card: #ffffff;
      --login-border: #e6e8ec;
      --login-input: #f7f8fa;
      --login-input-border: #dcdfe5;
      --login-title: #111318;
      --login-muted: #4b5563;
      --login-btn: #2f6bf5;
    }
    :root[data-theme='dark'] {
      --login-card: #16171b;
      --login-border: #25272d;
      --login-input: #121317;
      --login-input-border: #25272d;
      --login-title: #f3f4f6;
      --login-muted: #9ca3af;
      --login-btn: #5b82f7;
    }
    .login {
      position: fixed; inset: 0; z-index: 3;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px 16px 156px; box-sizing: border-box; /* как на сайте: блок чуть выше центра */
      font-family: Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    .login.hidden { opacity: 0; pointer-events: none; }
    /* как на живом сайте: логотип над заголовком */
    .login-brand { display: flex; flex-direction: column; align-items: center; gap: 0; margin-bottom: 26px; }
    .login-brand img { height: 162px; width: auto; display: block; transition: opacity 0.5s ease; }
    /* пока лиса летает осколками — логотип в окне скрыт */
    :root[data-burst='1'] .login-brand img { opacity: 0; transition: none; }
    /* логотип под тему: белая лиса — на тёмной, тёмная — на светлой */
    .logo-light { display: none !important; }
    :root:not([data-theme='dark']) .logo-dark { display: none !important; }
    :root:not([data-theme='dark']) .logo-light { display: block !important; }
    .login-brand span {
      font-size: 34px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; color: var(--login-title);
      transition: color 0.6s ease;
    }
    .login-card {
      width: min(380px, 100%); box-sizing: border-box; padding: 25px 22px 22px;
      background: var(--login-card); border: 1px solid var(--login-border); border-radius: 10px;
      transition: background-color 0.6s ease, border-color 0.6s ease;
    }
    .login-card h1 { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: var(--login-title); }
    .login-card p { margin: 0 0 18px; font-size: 12.5px; color: var(--login-muted); }
    .login-card label { display: block; margin-bottom: 14px; }
    .login-card label span { display: block; margin-bottom: 6px; font-size: 12px; color: var(--login-muted); }
    .login-card input {
      width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px;
      background: var(--login-input); border: 1px solid var(--login-input-border); border-radius: 8px;
      color: var(--login-title); font: inherit; font-size: 14px; outline: none;
      transition: background-color 0.6s ease, border-color 0.2s ease;
    }
    .login-card input:focus { border-color: var(--login-btn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--login-btn) 25%, transparent); }
    .login-card button {
      width: 100%; height: 40px; margin-top: 5px; border: 0; border-radius: 8px; cursor: pointer;
      background: var(--login-btn); color: #fff; font: inherit; font-size: 13px; font-weight: 500;
    }
  </style>
</head>
<body>
  <canvas class="veil-canvas" id="veil" aria-hidden="true"></canvas>

  <div class="login hidden" id="login">
    <div class="login-brand">
      <img class="logo-dark" src="logo-dark-still.svg" alt="DT" />
      <img class="logo-light" src="logo-light-still.svg" alt="DT" />
      <span>DT | DIAMOND TEAM</span>
    </div>
    <form class="login-card" onsubmit="return false">
      <h1>Вход в панель</h1>
      <p>Логин и пароль, затем код из приложения.</p>
      <label><span>Логин</span><input autocomplete="off" /></label>
      <label><span>Пароль</span><input type="password" autocomplete="off" /></label>
      <button type="submit">Войти</button>
    </form>
  </div>

  <div class="fx" id="fx">
    <div class="fx-title"><span>Эффекты</span><button id="fxCollapse">свернуть</button></div>
  </div>

  <div class="version" id="version"></div>
  <div class="controls">
    <button id="replay">Повторить интро</button>
    <button id="sceneToggle">Сцена: вкл</button>
    <button id="loginToggle">Окно входа: выкл</button>
    <button id="theme">Тема</button>
  </div>

  <script>
    document.write('<script src="src/veil-background.js?v=' + __v + '"><\/script>');
    document.write('<script src="src/scene.js?v=' + __v + '"><\/script>');
    document.write('<script src="src/logo-burst.js?v=' + __v + '"><\/script>');
  </script>
  <script>

    const bg = new VeilBackground(document.getElementById('veil'));
    window.veil = bg;
    // эффекты: состояние тумблеров запоминается в браузере
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('fx') || '{}'); } catch (e) {}
    bg.scene = new MinerScene(bg, { fx: saved });
    // лиса-логотип: в начале разлетается на плитки, в конце собирается обратно.
    // Если окно входа открыто — разлетается именно логотип из окна.
    bg.burst = new LogoBurst(bg, {
      dark: 'logo-dark-still.svg',
      light: 'logo-light-still.svg',
      anchor: () => {
        if (document.getElementById('login').classList.contains('hidden')) return null;
        const img = [...document.querySelectorAll('.login-brand img')].find((i) => getComputedStyle(i).display !== 'none');
        return img && img.getBoundingClientRect();
      },
    });

    const fxPanel = document.getElementById('fx');
    for (const [key, label] of MinerScene.FX) {
      const row = document.createElement('label');
      row.innerHTML = '<input type="checkbox"> <span></span>';
      row.querySelector('span').textContent = label;
      const box = row.querySelector('input');
      box.checked = bg.scene.fx[key];
      box.onchange = () => {
        bg.scene.setFx(key, box.checked);
        try { localStorage.setItem('fx', JSON.stringify(bg.scene.fx)); } catch (e) {}
        bg.restartScene(); // сразу показать сцену с этим эффектом с начала
      };
      fxPanel.append(row);
    }
    document.getElementById('fxCollapse').onclick = (e) => {
      e.target.textContent = fxPanel.classList.toggle('collapsed') ? 'развернуть' : 'свернуть';
    };

    document.getElementById('version').textContent = 'версия ' + VeilBackground.VERSION;
    bg.start();

    document.getElementById('replay').onclick = () => bg.replay();
    document.getElementById('sceneToggle').onclick = (e) => {
      e.target.textContent = 'Сцена: ' + (bg.scene.toggle() ? 'вкл' : 'выкл');
    };
    document.getElementById('loginToggle').onclick = (e) => {
      const hidden = document.getElementById('login').classList.toggle('hidden');
      e.target.textContent = 'Окно входа: ' + (hidden ? 'выкл' : 'вкл');
    };
    document.getElementById('theme').onclick = () => {
      const root = document.documentElement;
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    };
  </script>
</body>
</html>
