<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Veil Background</title>
  <script>
    try {
      const t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="src/veil.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--page-bg);
      color: var(--text);
      font: 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    /* объекты, стоящие на полу */
    .stand {
      width: 300px;
      padding: 18px 20px;
      box-sizing: border-box;
      border-radius: 14px;
      background: color-mix(in srgb, var(--page-bg) 70%, transparent);
      border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
      will-change: transform, opacity;
    }
    .stand h3 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .stand p { margin: 0; color: var(--text-muted); font-size: 15px; }

    .controls { position: fixed; top: 16px; right: 16px; z-index: 5; display: flex; gap: 8px; }
    .controls button {
      height: 32px; padding: 0 12px; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 12px;
      color: var(--text); background: transparent;
      border: 1px solid color-mix(in srgb, var(--text) 20%, transparent);
    }
  </style>
</head>
<body>
  <canvas class="veil-canvas" id="veil" aria-hidden="true"></canvas>

  <div class="stand" id="o1">
    <h3>Объект 1</h3>
    <p>Стоит на полу ближе всех. Две-три строки текста помещаются спокойно.</p>
  </div>
  <div class="stand" id="o2">
    <h3>Объект 2</h3>
    <p>Масштаб зависит от глубины, под объектом — контактная тень.</p>
  </div>
  <div class="stand" id="o3">
    <h3>Объект 3</h3>
    <p>Дальше в глубину — меньше и выше к горизонту.</p>
  </div>
  <div class="stand" id="o4">
    <h3>Объект 4</h3>
    <p>Появляется, когда до его плитки доходит волна проявления.</p>
  </div>

  <div class="controls">
    <button id="replay">Повторить интро</button>
    <button id="theme">Тема</button>
  </div>

  <script type="module">
    import { VeilBackground } from './src/veil-background.js';

    const bg = new VeilBackground(document.getElementById('veil'));
    window.veil = bg;

    // объекты на полу: col — плитка вбок от центра, row — ряд вглубь
    bg.place(document.getElementById('o1'), { col: -5, row: 0, height: 0.55 });
    bg.place(document.getElementById('o2'), { col: 4, row: 0, height: 0.55 });
    bg.place(document.getElementById('o3'), { col: -7, row: 6, height: 0.55 });
    bg.place(document.getElementById('o4'), { col: 6, row: 6, height: 0.55 });

    bg.start();

    document.getElementById('replay').onclick = () => bg.replay();
    document.getElementById('theme').onclick = () => {
      const root = document.documentElement;
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
    };
  </script>
</body>
</html>
