<style>
svg{--fg:#16181d;--mid:#9a9a9a;--ink:#fff;--cardfill:var(--fg);--cardmask:url(#cut);--rim:none;--claw:none} .cbody{fill:var(--cardfill)!important} #card{mask:var(--cardmask,none)} .rim{display:var(--rim,inline)} .claw{display:var(--claw,inline)} path,rect{fill:var(--fg)} g{transform-box:fill-box}
#tail{transform-origin:15% 95%} #earR{transform-origin:35% 78%} .lid{transform-origin:50% 0%;transform:scaleY(0)}
#headG{transform-origin:50% 100%} #hold{transform-origin:10% 40%}
.wave{fill:none;stroke:var(--fg);stroke-width:3;stroke-linecap:round;opacity:0}
.glint{fill:var(--fg);opacity:.35}

#tail{animation:swish 5s cubic-bezier(.45,0,.25,1) infinite}
