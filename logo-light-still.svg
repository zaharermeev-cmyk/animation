@keyframes tilt{0%,15%,85%,100%{transform:none}30%,70%{transform:rotate(-5deg)}}
@keyframes ear{0%,40%,54%,100%{transform:rotate(0)}45%{transform:rotate(14deg)}50%{transform:rotate(-4deg)}}
@keyframes lid{0%,55%,58%,61%,64%,100%{transform:scaleY(0)}56.5%,62.5%{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* панель: «Анимации» выключены */ *{animation:none!important}
</style>
